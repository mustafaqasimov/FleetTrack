<!DOCTYPE html>
<html lang="az">
<head>
    <meta charset="UTF-8">
    <title>FleetTrack - WebSocket Test</title>
    <script src="https://cdnjs.cloudflare.com/ajax/libs/sockjs-client/1.6.1/sockjs.min.js"></script>
    <script src="https://cdnjs.cloudflare.com/ajax/libs/stomp.js/2.3.3/stomp.min.js"></script>
    <style>
        body { font-family: sans-serif; max-width: 700px; margin: 40px auto; padding: 0 16px; }
        fieldset { margin-bottom: 20px; padding: 12px; }
        label { display: block; margin-top: 8px; font-size: 13px; color: #444; }
        input { width: 100%; padding: 6px; box-sizing: border-box; }
        button { margin-top: 10px; padding: 8px 14px; cursor: pointer; }
        #status { font-weight: bold; }
        #log { background: #111; color: #0f0; padding: 12px; height: 220px; overflow-y: auto;
            font-family: monospace; font-size: 13px; white-space: pre-wrap; }
    </style>
</head>
<body>

<h2>FleetTrack &ndash; WebSocket Test</h2>
<p>Status: <span id="status">bağlanmayıb</span></p>

<fieldset>
    <legend>1. Login (token almaq üçün)</legend>
    <label>Username</label>
    <input id="userName" value="admin">
    <label>Password</label>
    <input id="password" type="password">
    <button onclick="login()">Login</button>
</fieldset>

<fieldset>
    <legend>2. WebSocket-ə qoşul</legend>
    <button onclick="connect()">Connect &amp; Subscribe</button>
</fieldset>

<fieldset>
    <legend>3. GPS mövqeyi göndər</legend>
    <label>Vehicle ID</label>
    <input id="vehicleId" value="1">
    <label>Latitude</label>
    <input id="latitude" value="40.4093">
    <label>Longitude</label>
    <input id="longitude" value="49.8671">
    <button onclick="sendLocation()">Göndər</button>
</fieldset>

<h3>Canlı mesajlar</h3>
<div id="log"></div>

<script>
    let token = null;
    let stompClient = null;

    function log(msg) {
        const el = document.getElementById('log');
        el.textContent += msg + "\n";
        el.scrollTop = el.scrollHeight;
    }

    async function login() {
        const userName = document.getElementById('userName').value;
        const password = document.getElementById('password').value;

        const res = await fetch('/auth/login', {
            method: 'POST',
            headers: { 'Content-Type': 'application/json' },
            body: JSON.stringify({ userName, password })
        });

        if (!res.ok) {
            log('Login uğursuz oldu: ' + res.status);
            return;
        }

        const data = await res.json();
        token = data.token;
        log('Login uğurlu, token alındı.');
    }

    function connect() {
        const socket = new SockJS('/ws');
        stompClient = Stomp.over(socket);

        stompClient.connect({}, function () {
            document.getElementById('status').textContent = 'bağlıdır';
            log('WebSocket-ə qoşuldu.');

            stompClient.subscribe('/topic/vehicles/location', function (message) {
                log('CANLI MESAJ: ' + message.body);
            });
        }, function (error) {
            document.getElementById('status').textContent = 'xəta';
            log('Bağlantı xətası: ' + error);
        });
    }

    async function sendLocation() {
        if (!token) {
            log('Əvvəlcə login ol.');
            return;
        }

        const vehicleId = Number(document.getElementById('vehicleId').value);
        const latitude = Number(document.getElementById('latitude').value);
        const longitude = Number(document.getElementById('longitude').value);

        const res = await fetch('/location/update', {
            method: 'POST',
            headers: {
                'Content-Type': 'application/json',
                'Authorization': 'Bearer ' + token
            },
            body: JSON.stringify({ vehicleId, latitude, longitude })
        });

        log('POST /location/update -> ' + res.status);
    }
</script>

</body>
</html>
